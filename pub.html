<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NESCIO</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:#FAFAFA;color:#000;font-family:Arial,Helvetica,sans-serif}
body{display:flex;align-items:center;justify-content:center}
main{text-align:center;padding:30px}
p{margin:0;font-size:12px;font-weight:700;letter-spacing:.12em;line-height:1.5}
p+p{margin-top:55px}
html.dark-mode,body.dark-mode{background:#111;color:#F5F5F5}
@media(max-width:700px){main{padding:24px}p{font-size:11px}}
</style>
</head>
<body>
<main>
<p>O FIM É APENAS OUTRA FORMA DE PERMANECER</p>
<p>ACABOU-SE O TEMPO...</p>
</main>
<script>
(function(){
const saved=localStorage.getItem("nescio-theme");
if(saved==="dark"){
document.documentElement.classList.add("dark-mode");
document.body.classList.add("dark-mode");
}
})();
</script>
</body>
</html>
