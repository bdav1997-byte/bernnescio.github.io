<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NESCIO</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .landing-page {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 90px 25px 45px;
      text-align: center;
    }
    .landing-logo {
      width: 210px;
      height: auto;
      margin: 0 0 65px;
    }
    .landing-motto {
      max-width: 850px;
      margin: 0;
      color: #000;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 30px;
      font-weight: 700;
      letter-spacing: .025em;
      line-height: 1.25;
    }
    .landing-year {
      position: absolute;
      bottom: 25px;
      left: 0;
      width: 100%;
      color: #000;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 10px;
      font-weight: 400;
      letter-spacing: .14em;
    }
    @media (max-width: 700px) {
      .landing-page { padding: 75px 25px 45px; }
      .landing-logo { width: 175px; margin-bottom: 50px; }
      .landing-motto { max-width: 340px; font-size: 24px; line-height: 1.3; }
      .landing-year { bottom: 20px; font-size: 9px; }
    }
  </style>
</head>

<body>

  <div id="menu-container"></div>

  <main class="landing-page">
    <img src="NESCIOnLOGO.png" class="landing-logo" alt="NESCIO">
    <h1 class="landing-motto">O fim é apenas outra forma de permanecer</h1>
    <div class="landing-year">NESCIO - 2026</div>
  </main>

  <script src="menu.js"></script>

</body>
</html>
