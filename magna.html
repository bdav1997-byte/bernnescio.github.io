<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Galeria — NESCIO</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="galeriateste.css">
<script>(function(){try{document.documentElement.classList.toggle("dark-mode",localStorage.getItem("nescio-theme")==="dark")}catch(e){}})();</script>
<style>
  .magna-warning{
    position:fixed;
    inset:0;
    z-index:9999;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:28px;
    background:rgba(250,250,250,.72);
    backdrop-filter:blur(16px);
    -webkit-backdrop-filter:blur(16px);
    opacity:1;
    transition:opacity .45s ease;
  }
  html.magna-warning-open,
  body.magna-warning-open{
    overflow:hidden !important;
    overscroll-behavior:none;
  }
  .magna-warning.is-hidden{
    opacity:0;
    pointer-events:none;
  }
  .magna-warning-card{
    width:min(520px,100%);
    padding:42px 34px 36px;
    border:1px solid #000;
    background:rgba(250,250,250,.88);
    text-align:center;
    box-sizing:border-box;
  }
  .magna-warning-label{
    margin:0 0 24px;
    font-family:Arial,Helvetica,sans-serif;
    font-size:11px;
    font-weight:700;
    letter-spacing:.18em;
    line-height:1.4;
  }
  .magna-warning-text{
    margin:0 auto 32px;
    max-width:390px;
    font-family:"Cormorant Garamond",Georgia,"Times New Roman",serif;
    font-size:21px;
    font-weight:500;
    line-height:1.5;
  }
  .magna-warning-actions{
    display:flex;
    justify-content:center;
    gap:12px;
  }
  .magna-warning-button{
    min-width:120px;
    padding:12px 18px;
    border:1px solid #000;
    background:transparent;
    color:#000;
    font-family:Arial,Helvetica,sans-serif;
    font-size:11px;
    font-weight:700;
    letter-spacing:.12em;
    text-transform:uppercase;
    cursor:pointer;
    transition:background .2s ease,color .2s ease;
  }
  .magna-warning-button:hover,
  .magna-warning-button:focus-visible{
    background:#000;
    color:#fff;
    outline:none;
  }
  html.dark-mode .magna-warning{
    background:rgba(17,17,17,.72);
  }
  html.dark-mode .magna-warning-card{
    border-color:#F5F5F5;
    background:rgba(17,17,17,.9);
  }
  html.dark-mode .magna-warning-label{
    color:#F5F5F5;
  }
  html.dark-mode .magna-warning-text{
    color:#F5F5F5;
  }
  html.dark-mode .magna-warning-button{
    border-color:#F5F5F5;
    color:#F5F5F5;
  }
  html.dark-mode .magna-warning-button:hover,
  html.dark-mode .magna-warning-button:focus-visible{
    background:#F5F5F5;
    color:#111;
  }
  @media(max-width:700px){
    .magna-warning{padding:22px;}
    .magna-warning-card{padding:36px 24px 30px;}
    .magna-warning-text{font-size:20px;margin-bottom:28px;}
    .magna-warning-actions{flex-direction:column;gap:9px;}
    .magna-warning-button{width:100%;}
  }
</style>
</head>
<body>
<div id="menu-container"></div>

<div class="magna-warning" role="dialog" aria-modal="true" aria-labelledby="magna-warning-title">
  <div class="magna-warning-card">
    <p class="magna-warning-label" id="magna-warning-title">NESCIO · MAGNA</p>
    <p class="magna-warning-text">Esta página apresenta conteúdo de teor erótico e sexual.</p>
    <div class="magna-warning-actions">
      <button class="magna-warning-button" type="button" id="magna-continue">Continuar</button>
      <button class="magna-warning-button" type="button" id="magna-back">Voltar</button>
    </div>
  </div>
</div>

<main class="gallery-test-page">
  <header class="gallery-test-header">
    <p class="gallery-test-label">11 FOTOGRAFIAS · MAGNA</p>
    <h1>GALERIA</h1>
  </header>

  <section class="gallery-editorial" aria-label="Galeria editorial">
    
    <button class="gallery-item" type="button" data-index="0" aria-label="Abrir fotografia 01">
      <img src="galeria-teste-01.svg" alt="Magna — fotografia 1">
      <span class="gallery-number">01</span>
    </button>
    <button class="gallery-item" type="button" data-index="1" aria-label="Abrir fotografia 02">
      <img src="galeria-teste-02.svg" alt="Magna — fotografia 2">
      <span class="gallery-number">02</span>
    </button>
    <button class="gallery-item" type="button" data-index="2" aria-label="Abrir fotografia 03">
      <img src="galeria-teste-03.svg" alt="Magna — fotografia 3">
      <span class="gallery-number">03</span>
    </button>
    <button class="gallery-item" type="button" data-index="3" aria-label="Abrir fotografia 04">
      <img src="galeria-teste-04.svg" alt="Magna — fotografia 4">
      <span class="gallery-number">04</span>
    </button>
    <button class="gallery-item" type="button" data-index="4" aria-label="Abrir fotografia 05">
      <img src="galeria-teste-05.svg" alt="Magna — fotografia 5">
      <span class="gallery-number">05</span>
    </button>
    <button class="gallery-item" type="button" data-index="5" aria-label="Abrir fotografia 06">
      <img src="galeria-teste-06.svg" alt="Magna — fotografia 6">
      <span class="gallery-number">06</span>
    </button>
    <button class="gallery-item" type="button" data-index="6" aria-label="Abrir fotografia 07">
      <img src="galeria-teste-07.svg" alt="Magna — fotografia 7">
      <span class="gallery-number">07</span>
    </button>
    <button class="gallery-item" type="button" data-index="7" aria-label="Abrir fotografia 08">
      <img src="galeria-teste-08.svg" alt="Magna — fotografia 8">
      <span class="gallery-number">08</span>
    </button>
    <button class="gallery-item" type="button" data-index="8" aria-label="Abrir fotografia 09">
      <img src="galeria-teste-09.svg" alt="Magna — fotografia 9">
      <span class="gallery-number">09</span>
    </button>
    <button class="gallery-item" type="button" data-index="9" aria-label="Abrir fotografia 10">
      <img src="galeria-teste-10.svg" alt="Magna — fotografia 10">
      <span class="gallery-number">10</span>
    </button>
    <button class="gallery-item" type="button" data-index="10" aria-label="Abrir fotografia 11">
      <img src="galeria-teste-11.svg" alt="Magna — fotografia 11">
      <span class="gallery-number">11</span>
    </button>
  </section>
</main>

<div class="gallery-lightbox" aria-hidden="true">
  <button class="gallery-lightbox-close" type="button">FECHAR</button>
  <button class="gallery-lightbox-prev" type="button" aria-label="Fotografia anterior">←</button>
  <div class="gallery-lightbox-stage">
    <div class="gallery-lightbox-track">
      <div class="gallery-lightbox-slide"><img src="" alt=""></div>
      <div class="gallery-lightbox-slide"><img src="" alt=""></div>
      <div class="gallery-lightbox-slide"><img src="" alt=""></div>
    </div>
  </div>
  <button class="gallery-lightbox-next" type="button" aria-label="Fotografia seguinte">→</button>
  <div class="gallery-lightbox-count"></div>
</div>

<script>
(function(){
  var warning = document.querySelector(".magna-warning");
  var continueButton = document.getElementById("magna-continue");
  var backButton = document.getElementById("magna-back");

  document.documentElement.classList.add("magna-warning-open");
  document.body.classList.add("magna-warning-open");

  continueButton.addEventListener("click", function(){
    warning.classList.add("is-hidden");
    document.documentElement.classList.remove("magna-warning-open");
    document.body.classList.remove("magna-warning-open");
    setTimeout(function(){ warning.remove(); }, 500);
  });

  backButton.addEventListener("click", function(){
    if (window.history.length > 1) {
      window.history.back();
    } else {
      window.location.href = "index.html";
    }
  });
})();
</script>

<script>
(function(){
  var items = Array.from(document.querySelectorAll(".gallery-editorial .gallery-item"));
  var box = document.querySelector(".gallery-lightbox");
  var stage = box.querySelector(".gallery-lightbox-stage");
  var track = box.querySelector(".gallery-lightbox-track");
  var slides = Array.from(box.querySelectorAll(".gallery-lightbox-slide"));
  var count = box.querySelector(".gallery-lightbox-count");
  var prevButton = box.querySelector(".gallery-lightbox-prev");
  var nextButton = box.querySelector(".gallery-lightbox-next");
  var current = 0;
  var dragStartX = null;
  var dragStartY = null;
  var dragX = 0;
  var dragging = false;

  function pad(value){ return String(value).padStart(2,"0"); }

  function setSlide(slide, index){
    var img = slide.querySelector("img");
    if(index < 0 || index >= items.length){
      img.removeAttribute("src");
      img.alt = "";
      return;
    }
    var source = items[index].querySelector("img");
    img.src = source.src;
    img.alt = source.alt;
  }

  function updateUI(){
    count.textContent = pad(current + 1) + " / " + pad(items.length);
    prevButton.disabled = current === 0;
    nextButton.disabled = current === items.length - 1;
  }

  function centerTrack(animate){
    track.classList.toggle("is-animating", animate);
    dragX = 0;
    track.style.transform = "translate3d(-33.333333%,0,0)";
  }

  function render(index, animate){
    current = index;
    setSlide(slides[0], current - 1);
    setSlide(slides[1], current);
    setSlide(slides[2], current + 1);
    updateUI();
    centerTrack(animate);
  }

  function open(index){
    render(index, false);
    box.classList.add("open");
    box.setAttribute("aria-hidden","false");
    document.body.classList.add("gallery-lightbox-open");
  }

  function close(){
    box.classList.remove("open");
    box.setAttribute("aria-hidden","true");
    document.body.classList.remove("gallery-lightbox-open");
    centerTrack(false);
  }

  function completeMove(direction){
    var target = current + direction;
    if(target < 0 || target >= items.length){
      track.classList.add("is-animating");
      centerTrack(true);
      return;
    }

    track.classList.add("is-animating");
    track.style.transform = direction > 0
      ? "translate3d(-66.666666%,0,0)"
      : "translate3d(0%,0,0)";

    var done = function(){
      track.removeEventListener("transitionend", done);
      render(target, false);
    };
    track.addEventListener("transitionend", done);
  }

  function move(direction){
    if(direction < 0 && current === 0) return;
    if(direction > 0 && current === items.length - 1) return;
    completeMove(direction);
  }

  items.forEach(function(item,index){
    item.addEventListener("click", function(){ open(index); });
  });

  var closeButton = box.querySelector(".gallery-lightbox-close");

  function bindControl(button, handler){
    button.addEventListener("click", function(event){
      event.preventDefault();
      event.stopPropagation();
      handler();
    });
    button.addEventListener("touchend", function(event){
      event.preventDefault();
      event.stopPropagation();
      handler();
    }, {passive:false});
  }

  bindControl(closeButton, close);
  bindControl(prevButton, function(){ move(-1); });
  bindControl(nextButton, function(){ move(1); });

  box.addEventListener("click", function(event){
    var clickedImage = event.target.closest(".gallery-lightbox-slide img");
    var clickedControl = event.target.closest("button");

    if (!clickedImage && !clickedControl) close();
  });

  stage.addEventListener("touchstart", function(event){
    if(!box.classList.contains("open") || event.touches.length !== 1) return;
    dragStartX = event.touches[0].clientX;
    dragStartY = event.touches[0].clientY;
    dragX = 0;
    dragging = false;
    track.classList.remove("is-animating");
  }, {passive:true});

  stage.addEventListener("touchmove", function(event){
    if(dragStartX === null || !event.touches.length) return;
    var dx = event.touches[0].clientX - dragStartX;
    var dy = event.touches[0].clientY - dragStartY;

    if(!dragging){
      if(Math.abs(dx) < 8) return;
      if(Math.abs(dy) > Math.abs(dx)) {
        dragStartX = null;
        return;
      }
      dragging = true;
    }

    var atStart = current === 0 && dx > 0;
    var atEnd = current === items.length - 1 && dx < 0;
    dragX = (atStart || atEnd) ? dx * 0.22 : dx;
    track.style.transform = "translate3d(calc(-33.333333% + " + dragX + "px),0,0)";
    event.preventDefault();
  }, {passive:false});

  stage.addEventListener("touchend", function(){
    if(dragStartX === null) return;
    var wasDragging = dragging;
    dragStartX = null;
    dragStartY = null;
    dragging = false;

    if(!wasDragging){
      centerTrack(false);
      return;
    }

    var threshold = Math.min(120, stage.clientWidth * 0.18);
    if(Math.abs(dragX) >= threshold){
      move(dragX < 0 ? 1 : -1);
    } else {
      track.classList.add("is-animating");
      centerTrack(true);
    }
  }, {passive:true});

  document.addEventListener("keydown", function(event){
    if(!box.classList.contains("open")) return;
    if(event.key === "Escape") close();
    if(event.key === "ArrowLeft") move(-1);
    if(event.key === "ArrowRight") move(1);
  });

  updateUI();
})();
</script>
<script src="menu.js"></script>
</body>
</html>
