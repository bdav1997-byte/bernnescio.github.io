<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NESCIO</title>
  <link rel="stylesheet" href="style.css">
  <script>
    (function () {
      try {
        document.documentElement.classList.toggle("dark-mode", localStorage.getItem("nescio-theme") === "dark");
      } catch (error) {}
    })();
  </script>
  <style>
    .landing-page {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 15px 25px 45px;
      text-align: center;
    }
    .landing-main-content {
      width: min(720px, 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .landing-rule {
      width: 42px;
      height: 1px;
      margin: 28px auto 0;
      background: #000;
      opacity: 0;
    }
    .landing-logo {
      width: min(460px, 82vw);
      height: auto;
      margin: 0 0 64px;
    }
    .landing-motto {
      width: min(620px, 92vw);
      max-width: 100%;
      margin: 0;
      color: #000;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 24px;
      font-weight: 400;
      letter-spacing: .065em;
      line-height: 1.35;
      opacity: 0;
    }
    .landing-latest {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      margin-top: 24px;
      color: #000;
      text-decoration: none;
      opacity: 0;
    }
    .landing-latest-label {
      font-family: Arial, Helvetica, sans-serif;
      font-size: 9px;
      font-weight: 700;
      letter-spacing: .16em;
    }
    .landing-latest-title {
      font-family: Arial, Helvetica, sans-serif;
      font-size: 12px;
      font-weight: 400;
      letter-spacing: .1em;
    }
    .landing-latest:hover .landing-latest-title {
      text-decoration: underline;
      text-underline-offset: 4px;
    }
    .landing-archive {
      display: block;
      margin-top: 24px;
      color: #000;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 9px;
      font-weight: 400;
      letter-spacing: .14em;
      line-height: 1.5;
      text-decoration: none;
      opacity: 0;
    }
    
    .landing-archive:hover {
      text-decoration: underline;
      text-underline-offset: 4px;
    }
    .landing-year {
      position: absolute;
      bottom: 25px;
      left: 0;
      width: 100%;
      color: #000;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 10px;
      font-weight: 400;
      letter-spacing: .14em;
      opacity: 0;
    }
    .landing-author {
      display: block;
      margin-top: 5px;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 10px;
      font-weight: 400;
      letter-spacing: .14em;
    }
    @keyframes landingFadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    /* Os elementos mantêm o espaço no layout durante a entrada.
       Assim, a página não salta nem se recentra enquanto a animação decorre. */
    .landing-page.landing-animate .landing-motto {
      animation: landingFadeIn 1.2s ease-out forwards;
      animation-delay: .65s;
    }

    .landing-page.landing-animate .landing-rule {
      animation: landingFadeIn .7s ease-out forwards;
      animation-delay: 1.75s;
    }

    .landing-page.landing-animate .landing-latest {
      animation: landingFadeIn 1s ease-out forwards;
      animation-delay: 2s;
    }

    .landing-page.landing-animate .landing-archive {
      animation: landingFadeIn .9s ease-out forwards;
      animation-delay: 2.85s;
    }

    .landing-page.landing-animate .landing-year {
      animation: landingFadeIn 1.2s ease-out forwards;
      animation-delay: 3.2s;
    }
    .landing-page:not(.landing-animate) .landing-motto,
    .landing-page:not(.landing-animate) .landing-rule,
    .landing-page:not(.landing-animate) .landing-latest,
    .landing-page:not(.landing-animate) .landing-archive,
    .landing-page:not(.landing-animate) .landing-year {
      opacity: 1;
    }
    @media (prefers-reduced-motion: reduce) {
      .landing-motto,
      .landing-rule,
      .landing-latest,
      .landing-archive,
      .landing-year {
        opacity: 1 !important;
        animation: none !important;
      }
    }
    html.dark-mode .landing-motto,
    html.dark-mode .landing-year,
    html.dark-mode .landing-rule,
    html.dark-mode .landing-latest,
    html.dark-mode .landing-archive {
      color: #F5F5F5;
    }
    @media (max-width: 700px) {
      .landing-page {
        padding: 20px 25px 45px;
      }

      .landing-logo {
        width: min(330px, 82vw);
        margin-bottom: 48px;
      }

      .landing-motto {
        width: 300px;
        max-width: 92vw;
        font-size: 18px;
        line-height: 1.4;
        letter-spacing: .06em;
      }

      .landing-rule {
        width: 34px;
        margin-top: 22px;
      }

      .landing-latest {
        margin-top: 20px;
        gap: 8px;
      }

      .landing-latest-label {
        font-size: 8px;
      }

      .landing-latest-title {
        font-size: 10px;
        letter-spacing: .08em;
      }

      .landing-archive {
        margin-top: 18px;
        font-size: 8px;
        letter-spacing: .12em;
      }

      .landing-year {
        bottom: 20px;
        font-size: 9px;
      }

      .landing-author {
        margin-top: 4px;
        font-size: 9px;
        letter-spacing: .14em;
      }
    }
  </style>
</head>

<body>

  <div id="menu-container"></div>

  <main class="landing-page">
    <div class="landing-main-content">
      <img src="NESCIOnLOGO.png" class="landing-logo" alt="NESCIO">
      <h1 class="landing-motto">O FIM É APENAS OUTRA FORMA DE PERMANECER</h1>
      <div class="landing-rule" aria-hidden="true"></div>
      <a class="landing-latest" href="soberaniadafutilidade.html" aria-label="Última publicação: Soberania da Futilidade">
      <span class="landing-latest-label">ÚLTIMA PUBLICAÇÃO</span>
      <span class="landing-latest-title">SOBERANIA DA FUTILIDADE</span>
    </a>
    <a class="landing-archive" href="arquivo.html" aria-label="33 textos publicados">
      <span id="landing-archive-count">NESCIO • 2026 • 33 TEXTOS</span>
    </a>
    </div>
    </main>

  <script>
    (function () {
      var page = document.querySelector('.landing-page');
      if (!page) return;

      var storageKey = 'nescio-landing-last-visit';
      var now = Date.now();
      var fiveMinutes = 5 * 60 * 1000;
      var shouldAnimate = true;

      try {
        var lastVisit = Number(localStorage.getItem(storageKey));
        shouldAnimate = !lastVisit || (now - lastVisit >= fiveMinutes);
        localStorage.setItem(storageKey, String(now));
      } catch (error) {}

      if (shouldAnimate && !window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
        page.classList.add('landing-animate');
      }
    })();
  </script>
  <script>
    (function () {
      var countElement = document.getElementById('landing-archive-count');
      if (!countElement) return;

      fetch('publicacoes.json', { cache: 'no-store' })
        .then(function (response) {
          if (!response.ok) throw new Error('Não foi possível carregar o arquivo.');
          return response.json();
        })
        .then(function (data) {
          var publications = Array.isArray(data) ? data : data.publicacoes;
          if (!Array.isArray(publications)) return;

          countElement.textContent = 'NESCIO • 2026 • ' + publications.length + (publications.length === 1 ? ' TEXTO' : ' TEXTOS');
        })
        .catch(function () {});
    })();
  </script>
  <script src="menu.js"></script>

</body>
</html>
