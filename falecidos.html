<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FALECIDOS — NESCIO</title>
  <link rel="stylesheet" href="style.css">
  <script>
    (function () {
      try {
        document.documentElement.classList.toggle("dark-mode", localStorage.getItem("nescio-theme") === "dark");
      } catch (error) {}
    })();
  </script>
<style>
.falecidos-logo{position:relative;display:block;width:max-content;margin:0 auto 0;}
.falecidos-logo .logo{display:block;position:relative;z-index:1;}
.falecidos-circle{position:absolute;z-index:2;left:50%;top:50%;width:calc(100% - 2px);height:calc(100% - 2px);border:1px solid currentColor;border-radius:50%;transform:translate(-50%,-50%);pointer-events:none;}
html.dark-mode .falecidos-circle,body.dark-mode .falecidos-circle{border-color:#F5F5F5;}
</style>
</head>
<body>
  <div id="menu-container"></div>
  <main>
    <a href="index.html" class="back-link">← VOLTAR</a>
    <div class="falecidos-logo" aria-label="NESCIO"><img src="LOGO.png" class="logo" alt="NESCIO"><span class="falecidos-circle" aria-hidden="true"></span></div>
    <article>
      <h1>FALECIDOS</h1>
      <p>Textos descartados da primeira era.</p>
      <p>Um pequeno arquivo de coisas que chegaram a existir antes de deixarem de existir.</p>
    </article>
  </main>
  <script src="menu.js"></script>
</body>
</html>
